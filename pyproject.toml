[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ydbackup"
version = "0.1.0"
description = "A safe, non-deleting Yandex Disk to Google Drive backup tool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "google-api-python-client>=2.160,<3",
  "google-auth>=2.38,<3",
  "google-auth-httplib2>=0.2,<1",
  "google-auth-oauthlib>=1.2,<2",
  "requests>=2.32,<3",
]

[project.scripts]
ydbackup = "ydbackup.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

